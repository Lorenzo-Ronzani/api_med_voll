spring:
  application:
    name: api_med_voll
  datasource:
    url: jdbc:mysql://localhost:3306/vollmed_api
    username: root
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace